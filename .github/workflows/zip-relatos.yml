name: Empaquetar relatos fantasticos

on:
  push:
    paths:
      - 'relatos-fantasticos/**'
      - '.github/workflows/zip-relatos.yml'

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear ZIP
        run: zip -r relatos-fantasticos.zip relatos-fantasticos
      - name: Subir ZIP
        uses: actions/upload-artifact@v4
        with:
          name: relatos-fantasticos
          path: relatos-fantasticos.zip
